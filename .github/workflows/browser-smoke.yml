name: J-WOO browser rendering smoke
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install Korean font fallback for visual inspection
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-nanum
      - name: Install headless browser for CI only
        run: |
          npm install --no-save --package-lock=false playwright@1.56.0
          npx playwright install chromium
      - run: npm run build
      - name: Check music editor UI and PDF download in Chromium
        run: node tests/browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jwoo-browser-smoke
          path: artifacts/browser-smoke/
          if-no-files-found: ignore
          retention-days: 7
