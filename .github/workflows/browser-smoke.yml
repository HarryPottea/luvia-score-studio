name: J-WOO browser rendering smoke
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install headless browser for CI only
        run: |
          npm install --no-save --package-lock=false playwright@1.56.0
          npx playwright install chromium
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent MusicXML XSD validator
        run: python3 -m pip install --only-binary=:all: lxml==5.4.0
      - name: Validate W3C MusicXML 4.0 schema and independent 10-score corpus
        run: python3 scripts/validate_musicxml_4.py
      - name: Check music editor UI and PDF download in Chromium
        run: node tests/browser-smoke.mjs
      - name: Validate real browser MusicXML edits against W3C 4.0 XSD
        run: python3 scripts/validate_musicxml_4.py --exports-dir artifacts/browser-smoke/stage6
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jwoo-browser-smoke
          path: artifacts/browser-smoke/
          if-no-files-found: ignore
          retention-days: 7
