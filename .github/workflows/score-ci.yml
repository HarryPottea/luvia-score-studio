name: Score Studio checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --check src/main.js
      - run: node --check src/part-export.js
      - run: node --check src/rhythm-rules.js
      - run: node --check src/rhythm-dom.js
      - run: node --check src/notation-review.js
      - run: node --check src/layout-profile.js
      - run: node --check src/pdf-batch.js
      - run: node --check src/pdf-bytes.js
      - run: node --check src/v2-controls.js
      - run: node --check src/editor-core.js
      - run: node --check src/editor-history.js
      - run: node --check src/v3-controls.js
      - run: node --check src/midi-import.js
      - run: node --check src/advanced-score.js
      - run: node --check src/advanced-controls.js
      - run: node --check src/score-hit.js
      - run: node --check src/studio-v4-core.js
      - run: node --check src/studio-v4-playback.js
      - run: node --check src/studio-v4-drafts.js
      - run: node --check src/studio-v4-vector.js
      - run: node --check src/studio-v4.js
      - run: node --check src/studio-v4-professional.js
      - run: node --check src/studio-v4-audit.js
      - run: node --test tests/*.test.mjs
      - run: python3 tests/audit_musicxml.py --self-test
      - run: python3 tests/audit_musicxml.py tests/fixtures/complex-voices-original.musicxml --compare tests/fixtures/complex-voices-pitch-edited.musicxml --allow-pitch
      - run: npm run build
